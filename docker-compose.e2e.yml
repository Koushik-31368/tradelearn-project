# docker-compose.e2e.yml
# ─────────────────────────────────────────────────────────────────────────────
# E2E override for Playwright testing.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d
#   docker-compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
#
# This file adds a throwaway Postgres container and overrides:
#   - DATABASE_URL  → points at the local e2e Postgres (not any real DB)
#   - JWT secrets   → throwaway values, never reuse real secrets here
#   - COOKIE_SECURE → false  (http://localhost can't send Secure cookies)
#   - COOKIE_SAME_SITE → Lax (same-origin dev, not cross-domain None)
#   - REDIS_ENABLED → true   (needed for multiplayer WS relay)
#   - REACT_APP_API_URL → backend on localhost:8080
#
# The entire stack (Postgres, Redis, backend, frontend) is ephemeral.
# Run `docker-compose ... down -v` to destroy all data between runs.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Throwaway Postgres (e2e only) ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradelearn_e2e
      POSTGRES_USER: e2e_user
      POSTGRES_PASSWORD: e2e_password_throwaway
    ports:
      - "5433:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e_user -d tradelearn_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  # ── Backend overrides for e2e ─────────────────────────────────────────────
  backend:
    environment:
      # Point at the local throwaway Postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/tradelearn_e2e
      DATABASE_USERNAME: e2e_user
      DATABASE_PASSWORD: e2e_password_throwaway

      # Throwaway JWT secrets (never use real secrets here)
      JWT_SECRET: e2e_throwaway_jwt_secret_32chars_minimum_length_ok
      JWT_REFRESH_SECRET: e2e_throwaway_refresh_secret_different_from_jwt_secret_ok
      JWT_EXPIRATION_MS: 86400000
      JWT_REFRESH_EXPIRATION_MS: 604800000

      # Cookie: must be non-Secure + Lax for http://localhost
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: "Lax"

      # Enable Redis (needed for multiplayer WebSocket relay)
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # CORS: allow frontend origin
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend overrides for e2e ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8080

volumes:
  postgres_e2e_data:
